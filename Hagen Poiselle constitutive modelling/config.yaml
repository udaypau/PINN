# Hagen-Poiseuille PINN parameters
# Write floats like 1.0e-6 (not 1e-6), otherwise YAML reads them as text.

run_name: silu_9x160_dp2      # results go to runs/<run_name>/
seed: 0
#flow Parameters
# pressure boundary values (p*)
p_in: 0.0
p_out: -2.0
H: 0.5
L: 10
mu: 0.01
u0: 1
# geometry
n_points: 70                  # N x N grid on [0,1]x[0,1]

# model
num_layers: 3
num_hidden: 160
activation: silu              # tanh | silu
init_weight: xavier_normal    # xavier_normal | xavier_uniform | kaiming_normal | kaiming_uniform | normal
init_bias: zeros              # zeros | normal



# loss weights (used for optimisation only)
weights:
  cont: 1.0
  momx: 1.0
  momy: 1.0
  constP: 1.0
  wall: 10.0
  pres: 10.0

# training: Adam -> L-BFGS
adam_lr: 2.0e-3
min_lr: 1.0e-6
lr_factor: 0.5
lr_patience: 200
switch_loss: 1.0e-4
max_adam: 20000
lbfgs_rounds: 20
lbfgs_iters: 200
tol: 1.0e-10
log_every: 200

# reference check for the progress report (RMS vs exact solution)
n_data: 500                   # random points drawn from the domain
data_seed: 0